
name: Build and sign Windows EXE

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        shell: pwsh
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          msbuild NetDiskDownloader.sln /m `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:RestorePackages=false `
            "/p:OutDir=$outDir\"

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed"
          }

      - name: Verify build output exists
        shell: pwsh
        run: |
          $exe = "artifacts/NetDiskDownloader.exe"

          if (!(Test-Path $exe)) {
            Get-ChildItem -Recurse -Filter NetDiskDownloader.exe |
              Select-Object FullName
            throw "Build output not found: $exe"
          }

      - name: Upload unsigned EXE
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: NetDiskDownloader-unsigned
          path: artifacts/NetDiskDownloader.exe
          if-no-files-found: error

      - name: Submit to SignPath
        id: sign
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: netdiskdownloader
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Verify signed EXE
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $exe = "signed/NetDiskDownloader.exe"

          if (!(Test-Path $exe)) {
            Get-ChildItem signed -Recurse
            throw "Signed EXE not found"
          }

          $signature = Get-AuthenticodeSignature $exe

          if ($signature.Status -ne "Valid") {
            throw "Invalid signature: $($signature.Status)"
          }

          Write-Host "Signer: $($signature.SignerCertificate.Subject)"

      - name: Upload signed EXE
        if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: NetDiskDownloader-signed
          path: signed/NetDiskDownloader.exe
          if-no-files-found: error
